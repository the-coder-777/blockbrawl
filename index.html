<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warning</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial Black', Impact, sans-serif;
        }

        .warning-text {
            color: #ffffff;
            font-size: 5vw;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 2px;
            padding: 20px;
            /* Simple 1-second looping flash animation */
            animation: flashWarning 1s infinite alternate;
        }

        @keyframes flashWarning {
            0% {
                background-color: #000000;
                text-shadow: none;
            }
            100% {
                background-color: #ff0000;
                text-shadow: 0 0 20px #ffffff;
            }
        }
    </style>
</head>
<body>

    <div class="warning-text">
        get off of the brainrot
    </div>

</body>
</html>
